# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a6a83233873c03eaa08a4694be10ca8f"
name = "Size Chart"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_app_proxy"

[webhooks]
api_version = "2024-10"

[auth]
redirect_urls = [
  "https://shopify.dev/apps/default-app-home/auth/callback",
  "https://shopify.dev/apps/default-app-home/auth/shopify/callback",
  "https://shopify.dev/apps/default-app-home/api/auth"
]

[app_proxy]
url = "https://shopify.dev/apps/default-app-home"
subpath = "size-chart"
prefix = "apps"

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
